name: papani

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dump pages
        run: |
          set +e
          UA='papani/1.0 (+https://petrhrebenar.github.io/papani/)'
          for u in https://restauracekathmandu.cz/denni-menu https://www.restauraceeverest.cz/denni-menu https://pizzeriacastello.cz/ https://lokal-dlouha.ambi.cz/menu/denni-menu; do
            echo "=================== $u"
            getent ahosts $(echo $u | cut -d/ -f3) | head -4
            curl -sS -m 30 -A "$UA" -H 'Accept-Language: cs' -o page.html -w 'HTTP %{http_code} size %{size_download} ip %{remote_ip}\n' "$u"
            curl -4 -sS -m 30 -A "$UA" -o /dev/null -w 'IPv4: HTTP %{http_code} ip %{remote_ip}\n' "$u"
            echo "--- tables:"; grep -o '<table[^>]*>' page.html | head -5
            echo "--- body text:"
            python3 -c "import re,sys,html;t=open('page.html',errors='replace').read();t=re.sub(r'(?s)<(script|style)[^>]*>.*?</\1>','',t);t=re.sub(r'<[^>]+>',' ',t);t=html.unescape(re.sub(r'\s+',' ',t));i=max(0,t.lower().find('pondělí')-300);print(t[i:i+2500])"
            echo "--- raw around menu:"; python3 -c "t=open('page.html',errors='replace').read();i=t.lower().find('pondělí');i=i if i>=0 else t.lower().find('menu');print(t[max(0,i-1500):i+2500])"
          done
