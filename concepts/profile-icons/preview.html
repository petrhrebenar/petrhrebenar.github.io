<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><title>Profile pictograms, proposal</title>
<link rel="stylesheet" href="../../style.css">
<style>
.page h2{margin-top:1.6em}
.row{display:flex;gap:2.2em;align-items:flex-end;margin:.8em 0 0}
.row figure{margin:0;text-align:center;font-size:.7em}
.row img{display:block;margin:0 auto .5em;width:96px;height:96px}
.icons{display:inline-flex;gap:.7em;align-items:center;vertical-align:middle}
.icons img{width:26px;height:26px;display:block}
.icons .tile{width:30px;height:26px}
.tile{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:2px solid #000;box-sizing:border-box;font-weight:700;font-size:12px;line-height:1;white-space:nowrap;hyphens:none;-webkit-hyphens:none;text-decoration:none}
.big .tile{width:96px;height:96px;border-width:6px;font-size:46px}
</style></head><body><main class="page">
<h1>Profile pictograms</h1>
<h2>A. Pictograms</h2>
<div class="row">
<figure><img src="identifier.svg" alt="">ORCID<br>identifier, barcode</figure>
<figure><img src="citations.svg" alt="">Google Scholar<br>citations, quotation marks</figure>
<figure><img src="network.svg" alt="">ResearchGate<br>network, linked nodes</figure>
</div>
<dl class="contacts"><div><dt>Profiles</dt><dd><span class="icons"><img src="citations.svg" alt=""><img src="identifier.svg" alt=""><img src="network.svg" alt=""></span></dd></div></dl>
<h2>B. Monogram tiles</h2>
<div class="row big">
<figure><span class="tile">OR</span><br>ORCID</figure>
<figure><span class="tile">GS</span><br>Google Scholar</figure>
<figure><span class="tile">RG</span><br>ResearchGate</figure>
</div>
<dl class="contacts"><div><dt>Profiles</dt><dd><span class="icons"><span class="tile">GS</span><span class="tile">OR</span><span class="tile">RG</span></span></dd></div></dl>
</main></body></html>
