<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Papání</title>
<style>
@font-face{font-family:"Latin Modern Roman";src:url("../fonts/lmroman10-regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Latin Modern Roman";src:url("../fonts/lmroman10-italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Latin Modern Roman";src:url("../fonts/lmroman10-bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
:root{
  --bg:#ffffff; --card:#ffffff; --ink:#000000; --muted:#555555; --line:#000000; --rule:#c8c8c8;
  --accent:#2f5d8a; --accent-soft:#eef3f8; --warm:#b0592d; --warm-soft:#f8ede6;
  --late:#b3261e; --ok:#2e7d4f;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:17px/1.4 "Latin Modern Roman","Computer Modern Serif",Georgia,serif}
.wrap,.top{max-width:1012px;margin:0 auto;padding-left:16px;padding-right:16px}
.wrap{padding-top:36px;padding-bottom:60px;flex:1;width:100%}
footer{border-top:1px solid var(--ink)}
footer .top{font-size:13px;padding-top:12px;padding-bottom:12px}
header{border-bottom:1px solid var(--ink)}
.top{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding-top:14px;padding-bottom:10px}
h1{font-size:22px;font-weight:700;margin:0;flex:1}
h2{font-size:24px;color:var(--ink);margin:52px 0 14px;font-weight:700}
a{color:inherit}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.statusbox{display:flex;flex-direction:column;align-items:flex-end;gap:1px;min-width:0}
.sched{font-size:12px;color:var(--muted);text-align:right}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--ok)} .dot.busy{background:var(--warm)}
button{font:inherit;color:inherit}
.btn{background:var(--card);border:1px solid var(--line);border-radius:0;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:0;padding:10px 14px;font-size:14px;margin-bottom:24px}
.banner.warn{background:var(--warm-soft);border-color:var(--warm)}
/* day tabs */
.tabs{display:flex;gap:6px;align-items:center;margin:0 0 14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);border-radius:0;padding:5px 14px;cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .n{opacity:.6;margin-left:6px}
.tab.today:not(.on){box-shadow:inset 0 -3px 0 var(--accent)}
/* group picker */
.pick{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;border:1px solid var(--line);padding:10px 16px;margin:0 0 16px}
.pick .lbl{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:0;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
/* cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:stretch}
.card{background:var(--card);border:1px solid var(--line);border-radius:0;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.wide{grid-column:1/-1}
.card h3{margin:0;font-size:18px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.card h3 .name{flex:1}
.card h3 a{font-size:13px;font-weight:400;color:var(--accent)}
.sub{font-size:13px;color:var(--muted)}
.sub.warn{color:var(--warm)} .sub.err{color:var(--late)}
.sub a{color:var(--accent)}
.card h3+.sub{margin-top:-6px}
.part{display:flex;flex-direction:column;gap:10px}
.part+.part{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.sec{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 -4px}
ul.menu{list-style:none;margin:0;padding:0}
ul.menu li{display:flex;gap:14px;align-items:baseline;padding:5px 0;border-top:1px solid var(--rule)}
ul.menu li:first-child{border-top:0}
ul.menu .dish{flex:1;min-width:0;overflow-wrap:anywhere}
ul.menu .dish small{display:block;font-size:13px;line-height:1.3;color:var(--muted)}
ul.menu .price{white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{color:var(--muted)}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
details .sec{margin-top:12px}
.pics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.pics.one{grid-template-columns:minmax(0,480px)}
.pics a{display:block;border:1px solid var(--rule)}
.pics img{display:block;width:100%;height:auto}
ul.links{list-style:none;margin:0;padding:0;border:1px solid var(--line)}
ul.links li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--rule)}
ul.links li:first-child{border-top:0}
ul.links b{flex:1}
ul.links a{color:var(--accent)}
@media (max-width:560px){h1{flex-basis:100%}.statusbox{align-items:flex-start;flex:1}.sched{text-align:left}.grid,.pics{grid-template-columns:1fr}h2{margin-top:40px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Papání</h1>
    <span class="statusbox"><span class="status"><span class="dot" id="dot"></span><span id="statusTxt"></span></span><span class="sched" id="sched"></span></span>
    <button class="btn" id="reloadBtn" title="Načíst data znovu">Obnovit</button>
  </div>
</header>
<div class="wrap">
  <div class="banner" id="banner" hidden></div>
  <div class="tabs" id="tabs"></div>
  <div class="pick" id="pick" hidden><span class="lbl">Skupina</span><span class="seg" id="groupSeg"></span></div>
  <div class="grid" id="cards"></div>
  <div id="picWrap"></div>
  <div id="linkWrap"></div>
</div>

<footer>
  <div class="top">*Working version vibe coded with Claude Opus 5.5, any bugs or request for more spots please report to Petr</div>
</footer>

<script>
"use strict";
/* Data: branch papani-data, written by .github/workflows/papani.yml */
const DATA="https://raw.githubusercontent.com/petrhrebenar/petrhrebenar.github.io/papani-data/";
/* Groups of restaurants; a restaurant without "group" in the data is in the first one. */
const GROUPS=[["faculty","Faculty"],["nedochvilni","Nedochvilní"]];
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
/* When the data is refreshed. Keep in step with the cron lines of .github/workflows/papani.yml
   (UTC, Monday to Friday) and with the scheduled task that turns menu images into text (Prague time). */
const RUNS_UTC=[[7,40],[8,40],[9,40]], TRANSCRIBE="10:55";
const DAYS=["Po","Út","St","Čt","Pá"], DAYS_LONG=["pondělí","úterý","středa","čtvrtek","pátek","sobota","neděle"];

const $=id=>document.getElementById(id);
const el=(tag,props={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(props)){if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v!==undefined&&v!==null&&v!==false)e.setAttribute(k,v===true?"":v)}for(const c of kids.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:String(c));return e};
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T00:00");d.setDate(d.getDate()+n);return iso(d)};
const dm=s=>{const d=new Date(s+"T00:00");return d.getDate()+". "+(d.getMonth()+1)+"."};
const mondayOf=s=>{const d=new Date(s+"T00:00");return addDays(s,-((d.getDay()+6)%7))};
const when=s=>{const d=new Date(s);return DAYS_LONG[(d.getDay()+6)%7]+" "+dm(iso(d))+" "+d.toLocaleTimeString("cs-CZ",{hour:"2-digit",minute:"2-digit"})};
const safeUrl=u=>/^https:\/\//.test(u||"")?u:null;
const imgUrl=s=>/^img\/[\w.-]+$/.test(s||"")?DATA+s:safeUrl(s);

let data=null, tr={}, day=null;
let group=GROUPS.some(g=>g[0]===store.get("papani.group"))?store.get("papani.group"):GROUPS[0][0];

function status(cls,txt){$("dot").className="dot"+(cls?" "+cls:"");$("statusTxt").textContent=txt}
function banner(txt,warn){const b=$("banner");b.hidden=!txt;b.textContent=txt||"";b.className="banner"+(warn?" warn":"")}
const getJson=async f=>{const r=await fetch(DATA+f+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return r.json()};

async function load(){
  status("busy","načítám");
  try{
    /* transcripts.json (text versions of menu images) is optional */
    [data,tr]=await Promise.all([getJson("menus.json"),getJson("transcripts.json").catch(()=>({}))]);
    if(!tr||typeof tr!=="object")tr={};
  }catch(e){
    data=null;status("","bez dat");
    banner("Data se nepodařilo načíst ("+e.message+"). Větev papani-data vznikne při prvním běhu workflow „papani“ v záložce Actions.",true);
    render();return;
  }
  const t=today(), cur=mondayOf(t);
  const wd=(new Date(t+"T00:00").getDay()+6)%7;
  if(!day||day<data.week||day>addDays(data.week,4))day=data.week===cur?addDays(data.week,Math.min(wd,4)):data.week;
  const up=new Date(data.updated), fresh=iso(up)===t;
  status(fresh?"on":"busy","aktualizováno "+when(data.updated));
  banner(data.week!==cur?"Zobrazená data jsou z týdne "+dm(data.week)+" až "+dm(addDays(data.week,4))+" Nová se načítají ve všední dny dopoledne.":"",true);
  render();
}

function sections(list){
  const out=[], extra=[];
  for(const s of list||[]){
    const block=[s.name?el("div",{class:"sec"},s.name):null,
      el("ul",{class:"menu"},(s.items||[]).map(i=>el("li",{},el("span",{class:"dish"},i.name,i.desc?el("small",{},i.desc):null),i.price?el("span",{class:"price"},i.price):null)))];
    (s.extra?extra:out).push(...block.filter(Boolean));
  }
  if(extra.length)out.push(el("details",{},el("summary",{},(list.filter(s=>s.extra).map(s=>s.name).join(", "))),extra));
  return out;
}

/* One menu: {title?, note?, days?: {iso: sections}, week?: {label?, from?, to?, sections}}.
   Used both for a restaurant read from HTML and for the text version of a menu image. */
function menu(m){
  const out=[];
  if(m.title)out.push(el("div",{class:"sub"},m.title));
  if(m.days){
    const d=m.days[day];
    if(d&&d.length)out.push(...sections(d));
    else out.push(el("div",{class:"empty"},day>today()&&!m.fromImage?"Menu na tento den ještě není zveřejněné.":Object.keys(m.days).length?"Na tento den v menu nic není.":"Menu na tento týden zatím na webu není."));
  }
  if(m.week&&(m.week.sections||[]).length){
    const w=m.week;
    out.push(el("div",{class:"sub"},(w.label||"týdenní menu")+(w.from?" "+dm(w.from)+" až "+dm(w.to):"")),...sections(w.sections));
  }
  if(m.note)out.push(el("div",{class:"sub"},m.note));
  return out;
}

function head(r){return [el("h3",{},el("span",{class:"name"},r.name),safeUrl(r.url)?el("a",{href:r.url,target:"_blank",rel:"noopener"},"web"):null),r.note?el("div",{class:"sub"},r.note):null]}

function card(r){
  const pics=(r.images||[]).map(i=>({src:imgUrl(i.src),full:imgUrl(i.src)||safeUrl(i.orig),t:tr[i.src]})).filter(p=>p.src);
  const text=pics.filter(p=>p.t&&typeof p.t==="object"), raw=pics.filter(p=>!text.includes(p));
  const has=r.days||r.week||pics.length;
  const c=el("div",{class:"card"+(raw.length?" wide":"")},head(r));
  if(r.status==="error")c.append(el("div",{class:"sub err"},"Poslední pokus o načtení webu selhal."+(has?" Níže je stav z "+(r.checked?when(r.checked):"dřívějška")+".":"")));
  else if(r.status==="stale"&&r.images)c.append(el("div",{class:"sub warn"},pics.length?"Obrázek s menu je starší než tento týden, na webu možná ještě není nové.":"Na webu se nenašel žádný obrázek s menu."));
  else if(r.status==="stale"&&!r.days)c.append(el("div",{class:"empty"},"Web zatím ukazuje starší menu"+(r.seen?" ("+dm(r.seen.from)+" až "+dm(r.seen.to)+")":"")+"."));
  if(r.days||r.week)c.append(...menu({days:r.days,week:r.week}));
  for(const p of text)c.append(el("div",{class:"part"},menu({...p.t,fromImage:true}),
    el("div",{class:"sub"},"přepsáno z obrázku, může obsahovat chyby, ",el("a",{href:p.full,target:"_blank",rel:"noopener"},"původní obrázek"))));
  if(raw.length)c.append(el("div",{class:"sub"},"menu je na webu jako obrázek, kliknutím se otevře v plné velikosti"),
    el("div",{class:"pics"+(raw.length===1?" one":"")},raw.map(p=>el("a",{href:p.full,target:"_blank",rel:"noopener"},el("img",{src:p.src,alt:"Menu "+r.name,loading:"lazy"})))));
  return {c,wide:raw.length>0};
}

function render(){
  const tabs=$("tabs"), cards=$("cards"), pw=$("picWrap"), lw=$("linkWrap");
  tabs.replaceChildren();cards.replaceChildren();pw.replaceChildren();lw.replaceChildren();
  $("pick").hidden=!data;
  if(!data)return;
  $("groupSeg").replaceChildren(...GROUPS.map(([id,label])=>el("button",{type:"button",class:id===group?"on":"","aria-pressed":id===group?"true":"false",onclick:()=>{group=id;store.set("papani.group",id);render()}},label)));
  const t=today();
  for(let i=0;i<5;i++){
    const d=addDays(data.week,i);
    tabs.append(el("button",{class:"tab"+(d===day?" on":"")+(d===t?" today":""),onclick:()=>{day=d;render()}},DAYS[i],el("span",{class:"n"},dm(d))));
  }
  const rs=(data.restaurants||[]).filter(r=>[].concat(r.group||GROUPS[0][0]).includes(group));
  if(!rs.length){cards.append(el("div",{class:"empty"},"V této skupině zatím nejsou žádné restaurace."));return}
  const built=rs.filter(r=>r.status!=="link").map(card), link=rs.filter(r=>r.status==="link");
  cards.append(...built.filter(b=>!b.wide).map(b=>b.c));
  const pic=built.filter(b=>b.wide).map(b=>b.c);
  if(pic.length)pw.append(el("h2",{},"Menu jako obrázek"),el("div",{class:"grid"},pic));
  if(link.length)lw.append(el("h2",{},"Jen odkaz"),el("ul",{class:"links"},link.map(r=>el("li",{},el("b",{},r.name),safeUrl(r.url)?el("a",{href:r.url,target:"_blank",rel:"noopener"},"otevřít menu"):null))));
}

(function(){
  const n=new Date();
  const t=RUNS_UTC.map(([h,m])=>new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate(),h,m)).toLocaleTimeString("cs-CZ",{hour:"numeric",minute:"2-digit",timeZone:"Europe/Prague"}));
  $("sched").textContent="menu se stahují po–pá kolem "+t.slice(0,-1).join(", ")+" a "+t[t.length-1]+", obrázková se přepisují v "+TRANSCRIBE;
})();
$("reloadBtn").addEventListener("click",load);
load();
</script>
</body>
</html>
