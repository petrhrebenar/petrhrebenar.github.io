name: papani

# Reads the lunch menus and publishes them as the papani-data branch
# (menus.json + img/), which /papani/ loads. The branch is rewritten as a
# single commit on every run, so it never grows and main stays untouched.

on:
  schedule:
    # GitHub cron is UTC: every half hour from 8:17 to 11:47 in summer, an hour
    # earlier in winter. GitHub often starts scheduled runs late or drops them,
    # so there are eight; a failed read keeps what an earlier run got. A Claude
    # scheduled task also checks at 9:52 and 10:52 Prague time and starts this
    # workflow itself when the data is older than an hour (watchdog.json).
    - cron: "17,47 6-9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: papani
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install --quiet beautifulsoup4

      - name: Previous data (keeps the days Lokál has already published this week)
        run: |
          git clone --quiet --depth 1 --branch papani-data \
            "https://github.com/${GITHUB_REPOSITORY}.git" data 2>/dev/null || mkdir -p data
          rm -rf data/.git

      - name: Scrape
        run: python .github/scripts/papani_scrape.py --out data

      - name: Publish to papani-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd data
          git init --quiet -b papani-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "papani: $(date -u +%F)"
          git push --quiet --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" papani-data
